; Copyright (c) 2026 Travis Cook. SPDX-License-Identifier: MIT
;
; Build:            pio run
; Upload:           pio run -t upload            (add --upload-port /dev/cu.usbmodemXXXX)
; Host checks:      ./test/host/run.sh
;
; Target is an Arduino Mega ADK (ATmega2560): 253,952 B flash, 8,192 B SRAM. Roomy —
; unlike the PSI, this board is nowhere near either ceiling.
;
; Dependencies are derived from what src/main.cpp actually includes: Adafruit NeoPixel
; and Adafruit PWM Servo Driver, plus Wire, which ships with framework-arduino-avr.
; Graham Short's Servos/SlowServo library is vendored in this repo at lib/Servos and is
; picked up automatically — lib/ is PlatformIO's default lib_dir, so no lib_extra_dirs.

; `pio run` and `pio run -t upload` build the firmware only. The probe build below is asked for by name.
[platformio]
default_envs = FlthyHPs

[env:FlthyHPs]
platform = atmelavr
board = megaADK
framework = arduino
; src/main.cpp setup() — Serial.begin(9600).
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1
; Defines WDP_FW, the "fw" of the WDP device announce (src/wdp/wdp_fork.h): the commit as
; `git rev-parse --short=7 HEAD`, plus "-dirty" for an uncommitted tree, or "unknown" without git.
extra_scripts = pre:scripts/wdp_fw.py
; The UART RX ring, 256 bytes instead of the core's 64. serialEvent() frames a line on its
; terminator and loop() handles one line a pass (contract v1.3, section 11: a 400-byte burst with no
; gaps must lose nothing). A burst of SHORT lines therefore backs up in the ring while it arrives:
; five-byte lines at 9600 baud survive a loop pass of up to about 6 ms with 64 bytes and about 15 ms
; with 256 (test/host/sim models the ring from this flag: r11_burst_of_short_lines_loses_none).
; 192 bytes of SRAM; the ring's index type stays 8-bit at 256. An Arduino IDE build keeps 64.
build_flags = -DSERIAL_RX_BUFFER_SIZE=256

; ---- bench build:  pio run -e FlthyHPs_probe -t upload ----------------------
; The same firmware plus one line a second on Serial, "#lp n=<passes> max_us=<longest pass>": the
; loop-pass time nothing has measured yet (the mean pass is 1000000 / n microseconds). The line goes
; to the WCB's port too, so this build is for the bench, never for the droid.
[env:FlthyHPs_probe]
extends = env:FlthyHPs
build_flags = ${env:FlthyHPs.build_flags} -DDN_LOOP_PROBE

; ---- static analysis:  pio check -e FlthyHPs --------------------------------
; Reports ONLY on src/contract/ and src/droidnet/. Two things make that true, and both are
; load-bearing:
;
;  1. check_src_filters picks the TRANSLATION UNIT to analyse. The contract layer is
;     header-only, so there is nothing to point clang-tidy AT except the TU that includes
;     it — src/main.cpp. Naming src/contract/ here would analyse zero files.
;  2. --line-filter then picks which files may REPORT. It is a suffix match on the path, so
;     only our three headers survive; every diagnostic from Ryan Sondgeroth's firmware and from
;     Adafruit's libraries is dropped. Without it this run is thousands of warnings of other
;     people's code, which we must not "fix" and which would bury anything real.
;     (--header-filter alone is not enough: clang-tidy ALWAYS reports diagnostics in the main
;     file, i.e. all of main.cpp, whatever the header filter says.)
;
; --target=avr is the entire point of running this at all. clang-tidy defaults to the HOST
; triple, where `int` is 32 bits — under which every AVR integer-promotion/overflow bug in
; this layer is invisible BY CONSTRUCTION, exactly as it is invisible to the host test suite
; (which is also a 32-bit-int build). With --target=avr, clang models the real 16-bit int.
; -mmcu=atmega2560 matches board = megaADK.
;
; The -Wno-* are noise from mixing two toolchains, not findings: PlatformIO passes avr-g++'s
; builtin defines to clang with -D (clang's AVR target defines them itself => redefined), and
; avr-libc's headers carry GCC-only attributes/pragmas clang does not know.
check_tool = clangtidy
check_src_filters =
    +<src/main.cpp>
check_flags =
    clangtidy: --config-file=.clang-tidy --header-filter=src/(contract|droidnet)/ --line-filter=[{"name":"src/contract/contract_core.h"},{"name":"src/contract/ContractFlthy.h"},{"name":"src/droidnet/native_ext.h"}] --extra-arg=--target=avr --extra-arg=-mmcu=atmega2560 --extra-arg=-Wno-macro-redefined --extra-arg=-Wno-unknown-attributes --extra-arg=-Wno-unknown-warning-option --extra-arg=-Wno-ignored-optimization-argument
